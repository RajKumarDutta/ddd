receivers:

  otlp:

    protocols:

      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318


processors:

  batch:
    timeout: 5s
    send_batch_size: 512


exporters:

  otlphttp/jaeger:
    endpoint: http://jaeger:4318

  debug:


service:

  pipelines:

    traces:

      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - otlphttp/jaeger

    metrics:

      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - debug

    logs:

      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - debug
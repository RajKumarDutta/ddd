receivers:

  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

      http:
        endpoint: 0.0.0.0:4318


exporters:

  otlphttp/jaeger:
    endpoint: http://jaeger:4318

  debug:
    verbosity: detailed


service:

  pipelines:

    traces:
      receivers:
        - otlp
      exporters:
        - otlphttp/jaeger

    metrics:
      receivers:
        - otlp
      exporters:
        - debug

    logs:
      receivers:
        - otlp
      exporters:
        - debug